[project]
name = "solosafe"
version = "0.1.0"
description = "SoloSafe v0.1 - 1인 가구 냉장고 식품 소비 우선순위 서비스 (Step 1: local foundation)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Step 3: 이메일 인증
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    # OCR 서버 호출 + 사진 업로드
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# alembic/ 은 마이그레이션 스크립트 디렉터리이지 배포 패키지가 아니다.
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]
