# SoloSafe v0.1 - local PostgreSQL only.
# cloud/managed DB는 사용하지 않는다. 실행: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: solosafe-postgres
    restart: unless-stopped
    environment:
      # 값은 .env 에서 주입된다. 이 파일에 실제 secret 을 적지 않는다.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 애플리케이션이 UTC 를 전제로 하므로 서버 타임존을 고정한다.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
